<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ESCORT — 운영 콘솔 (데모)</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="frame">
  <div class="demo-tag">OPERATIONS CONSOLE · S-07</div>
  <header class="app">
    <div class="wordmark">Escort<small>Operations Console</small></div>
    <a class="hbtn" href="index.html">← App</a>
  </header>
  <main class="app" id="main"></main>
  <div id="toast"></div>
</div>
<script src="assets/store.js"></script>
<script>
const FNAMES = ["채원","지유","서윤","하린","유나","가은","다인","소율"];
function render(){
  const s = load();
  const u = s.user;
  const cards = s.cards||[];
  const pays = s.payments||[];
  const ledger = s.ledger||[];
  const revenue = pays.reduce((a,p)=>a+p.amount,0);
  const womanPay = (s.rewards||[]).reduce((a,r)=>a+r.amount,0);

  document.getElementById("main").innerHTML = `
  <div class="notice">🛠️ 작업지시서 <b>S-07 운영 어드민</b>의 데모 구현 — 심사 큐 · 매칭 큐 · 정산 · 시뮬레이터. 실서비스에서는 Supabase 기반으로 동작합니다.</div>

  <h2 class="sec">Dashboard</h2>
  <div class="tier-cards" style="grid-template-columns:1fr 1fr 1fr">
    <div class="tc"><b>매출</b><div class="rate" style="font-size:13px">₩${fmt(revenue)}</div><small>이 기기 누적</small></div>
    <div class="tc"><b>리워드</b><div class="rate" style="font-size:13px">₩${fmt(womanPay)}</div><small>지급 누적</small></div>
    <div class="tc"><b>회원</b><div class="rate" style="font-size:13px">${u?1:0}명</div><small>이 기기</small></div>
  </div>

  <h2 class="sec">Member</h2>
  <div class="list">
    ${u ? `<div class="lrow"><div class="l"><b>${u.name} (${u.role==="m"?"Gentleman":"Lady"})</b><small>${u.phone} · 가입 ${u.joinedAt}${u.refBy?" · 추천 "+u.refBy:""}</small></div><span class="status ok">Approved</span></div>`
        : `<div class="lrow"><div class="l"><small>가입된 회원이 없습니다 — 앱에서 가입을 진행해 보세요.</small></div></div>`}
  </div>

  <h2 class="sec">Matching Queue</h2>
  <div class="list">
    ${cards.length ? cards.map(c=>`
      <div class="lrow"><div class="l"><b>${c.name} · ${c.score}점</b><small>${statusKo(c.status)}${c.rating?" · 평점 "+c.rating+"점":""}</small></div>
      ${c.status==="pending_female"
        ? `<button class="hbtn" onclick="approveMatch('${c.id}')">수락 처리</button>`
        : `<span class="status ${["matched","met","reviewed"].includes(c.status)?"ok":c.status==="pending_female"?"wait":c.status==="declined"||c.status==="expired"?"bad":""}">${c.status}</span>`}
      </div>`).join("")
    : `<div class="lrow"><div class="l"><small>발급된 카드가 없습니다.</small></div></div>`}
  </div>

  <h2 class="sec">Referral Ledger — 35만원 분배 기록</h2>
  <div class="list">
    ${ledger.length ? ledger.map(l=>`
      <div class="lrow"><div class="l"><b>교환 성사 — ${l.card}</b><small>회사 ₩${fmt(l.company)} · 여성 ₩${fmt(l.woman)}~10만 · 추천인(8%) ₩${fmt(l.referrer)}</small></div><div class="r">₩350,000</div></div>`).join("")
    : `<div class="lrow"><div class="l"><small>교환권 결제가 발생하면 자동 분배 원장이 기록됩니다.</small></div></div>`}
  </div>

  <h2 class="sec">Simulators</h2>
  <div class="list">
    <div class="lrow"><div class="l"><b>친구 가입 시뮬레이션</b><small>Lady 회원에게 활동 친구 1명 추가 (+가입 1만 + 첫 매칭 리워드)</small></div>
      <button class="hbtn" onclick="simFriend()">실행</button></div>
    <div class="lrow"><div class="l"><b>친구 매칭 발생</b><small>기존 친구가 35만원 매출 발생 → 티어 요율만큼 추천 리워드</small></div>
      <button class="hbtn" onclick="simFriendMatch()">실행</button></div>
    <div class="lrow"><div class="l"><b>주간 정산 실행</b><small>승인 리워드 일괄 지급 처리 (3.3% 원천징수 표기)</small></div>
      <button class="hbtn" onclick="simSettle()">실행</button></div>
  </div>

  <h2 class="sec">Danger Zone</h2>
  <div class="list">
    <div class="lrow"><div class="l"><b>데모 데이터 초기화</b><small>이 기기의 모든 상태 삭제</small></div>
      <button class="hbtn" style="border-color:rgba(226,106,106,.5);color:var(--bad)" onclick="if(confirm('전체 초기화할까요?')){reset();render();toast('초기화 완료')}">Reset</button></div>
  </div>`;
}
function statusKo(st){
  return {sent:"카드 발송됨 · 응답 대기", pending_female:"교환권 결제됨 · 상대 수락 대기", matched:"상호 수락 · 연락처 전달",
          met:"만남 완료 · 후기 대기", reviewed:"후기 완료", declined:"거절", expired:"48시간 만료"}[st]||st;
}
function approveMatch(id){
  patch(s => { const c = s.cards.find(x=>x.id===id); if(c) c.status = "matched"; });
  toast("수락 처리 완료 — 회원 화면에 연락처가 공개됩니다");
  render();
}
function simFriend(){
  const s = load();
  if(!s.user || s.user.role!=="f"){ toast("Lady 회원으로 가입된 상태에서 실행하세요"); return; }
  patch(st => {
    const name = FNAMES[(st.friends||[]).length % FNAMES.length] + "○";
    st.friends = st.friends||[];
    st.friends.push({name, joined:new Date().toISOString().slice(5,10), earned:10000, note:"심사 통과"});
    addReward(st, "referral", REWARD.referrerSignup, `${name} 가입 — 추천인 축하금`);
  });
  const t = tierOf(load());
  toast(`친구 추가됨 — 현재 ${TIERS[t].name} (${Math.round(TIERS[t].rate*100)}%)`);
  render();
}
function simFriendMatch(){
  const s = load();
  if(!s.user || s.user.role!=="f" || !(s.friends||[]).length){ toast("먼저 친구 가입 시뮬레이션을 실행하세요"); return; }
  patch(st => {
    const f = st.friends[Math.floor(Math.random()*st.friends.length)];
    const rate = TIERS[tierOf(st)].rate;
    const amt = Math.round(PRICE.exchange * rate);
    f.earned += amt; f.note = "매칭 발생";
    addReward(st, "referral", amt, `${f.name} 연락처 교환 발생 — 추천 ${Math.round(rate*100)}%`);
  });
  toast("추천 리워드가 적립되었습니다");
  render();
}
function simSettle(){
  const s = load();
  const total = (s.rewards||[]).reduce((a,r)=>a+r.amount,0);
  if(!total){ toast("지급할 리워드가 없습니다"); return; }
  toast(`정산 실행 (데모) — ₩${fmt(total)} 중 3.3% 원천징수 후 ₩${fmt(Math.round(total*0.967))} 지급`);
}
render();
</script>
</body>
</html>
