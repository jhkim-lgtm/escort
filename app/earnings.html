<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ESCORT — Statement (데모)</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="frame">
  <div class="demo-tag">DEMO APP · WORKING TITLE</div>
  <header class="app">
    <div class="wordmark">Escort<small>Lady Membership</small></div>
    <button class="hbtn" onclick="show('m-my')">My</button>
  </header>
  <main class="app" id="main"></main>

  <nav class="tabbar">
    <a class="on" href="earnings.html"><span class="ic">💳</span>Statement</a>
    <a onclick="shareCode()"><span class="ic">🔗</span>Invite</a>
    <a onclick="show('m-my')"><span class="ic">👤</span>My</a>
  </nav>

  <!-- MY -->
  <div class="mbg" id="m-my"><div class="sheet">
    <h3>My Membership</h3>
    <div class="list" id="my-info"></div>
    <button class="btn wide sm" style="margin-top:16px" onclick="if(confirm('데모 데이터를 초기화할까요?')){reset();location.href='index.html'}">데모 초기화 (로그아웃)</button>
    <button class="cancel" onclick="closeM()">Close</button>
  </div></div>

  <div id="toast"></div>
</div>
<script src="assets/store.js"></script>
<script>
const u = requireUser();
if(u && u.role!=="f") location.href = "cards.html";

function render(){
  const s = load();
  const tier = tierOf(s);
  const T = TIERS[tier];
  const total = rewardTotal(s);
  const friends = s.friends||[];
  const rewards = (s.rewards||[]).slice().reverse();
  const nFriends = friends.length;
  const need = tier==="rose" ? 3-nFriends : tier==="lady" ? 10-nFriends : 0;

  document.getElementById("main").innerHTML = `
  <div class="mcard-visual">
    <div class="row1"><div class="brand">Escort</div><div class="chip"></div></div>
    <div class="num">•••• •••• •••• ${String(hashStr(u.name+u.phone)%9000+1000)}</div>
    <div class="row2">
      <div class="holder"><small>${T.name} Member</small><b>${u.name}</b></div>
      <div class="since"><small>Referral Rate</small><b>${Math.round(T.rate*100)}%</b></div>
    </div>
  </div>

  <div class="stmt">
    <span class="kicker">Total Earnings</span>
    <div class="amt">₩${fmt(total)}</div>
    <div class="up">누적 리워드 · 매주 화요일 등록 계좌로 정산</div>
    <div class="list" style="margin-top:16px;border-radius:10px" id="reward-list">
      ${rewards.length ? rewards.map(r=>`
        <div class="lrow"><div class="l"><b>${r.note}</b><small>${r.at} · ${labelOf(r.type)}</small></div><div class="r grn">+₩${fmt(r.amount)}</div></div>`).join("")
      : `<div class="lrow"><div class="l"><small>아직 리워드가 없습니다 — 친구를 초대하거나 카드에 선택되면 이곳에 쌓입니다.</small></div></div>`}
    </div>
  </div>

  <h2 class="sec">Card Tiers</h2>
  <div class="tier-cards">
    <div class="tc rose ${tier==="rose"?"cur":""}"><b>Rose</b><small>심사 통과</small><div class="rate">5%</div></div>
    <div class="tc lady ${tier==="lady"?"cur":""}"><b>Lady</b><small>친구 3명+</small><div class="rate">8%</div></div>
    <div class="tc madam ${tier==="madam"?"cur":""}"><b>Madam</b><small>친구 10명+</small><div class="rate">12%</div></div>
  </div>
  <div class="notice">${tier==="madam"
    ? "💎 최고 등급입니다 — 전담 매니저 · 카드 우선 배정 · VIP 트립이 제공됩니다."
    : `다음 등급까지 <b>활동 친구 ${need}명</b> — 승급 시 요율이 오르고 ${tier==="rose"?"월 스타일링 지원 10만원 + 멤버스 파티":"전담 매니저 + 카드 우선 배정 + VIP 트립"} 혜택이 열립니다.`}</div>

  <div class="codebox">
    <span class="kicker">My Referral Code</span>
    <div class="cd">${u.refCode}</div>
    <div class="btnrow">
      <button class="btn sm" onclick="copyCode()">Copy Link</button>
      <button class="btn metal sm" onclick="shareCode()">Invite via Kakao</button>
    </div>
    <p>친구가 이 코드로 가입하면 친구도 축하금 30,000원,<br>당신은 친구의 결제마다 <b style="color:var(--metal-hi)">${Math.round(T.rate*100)}%</b>를 평생 적립합니다.</p>
  </div>

  <h2 class="sec">My Members — ${nFriends} Active</h2>
  <div class="list">
    ${nFriends ? friends.map(f=>`
      <div class="lrow"><div class="l"><b>${f.name}</b><small>${f.joined} 가입${f.note?" · "+f.note:""}</small></div><div class="r grn">+₩${fmt(f.earned)}</div></div>`).join("")
    : `<div class="lrow"><div class="l"><small>아직 초대한 친구가 없습니다 — 위 코드를 공유해 보세요.<br>친구 활동 시뮬레이션은 운영 콘솔(Console)에서 실행할 수 있습니다.</small></div></div>`}
  </div>`;

  document.getElementById("my-info").innerHTML = `
    <div class="lrow"><div class="l"><b>${u.name}</b><small>${u.phone} · ${u.birth} ${u.btime||""}</small></div><span class="status ok">${T.name}</span></div>
    <div class="lrow"><div class="l"><b>일간(사주)</b><small>궁합 산출 기준</small></div><div class="r dim">${dayStem(u.birth)}</div></div>
    <div class="lrow"><div class="l"><b>초대 코드(입력)</b><small>나를 초대한 멤버</small></div><div class="r dim">${u.refBy||"—"}</div></div>
    <div class="lrow"><div class="l"><b>정산 계좌</b><small>실서비스: 3.3% 원천징수 후 지급</small></div><div class="r dim">미등록 (데모)</div></div>`;
}
function labelOf(t){ return {signup:"가입 축하금", match:"매칭 리워드", review:"후기 리워드", rating:"평점 리워드", referral:"추천 리워드"}[t]||t; }
function inviteLink(){ return location.origin + location.pathname.replace("earnings.html","index.html") + "?ref=" + load().user.refCode; }
function copyCode(){ navigator.clipboard?.writeText(inviteLink()).catch(()=>{}); toast("초대 링크 복사됨 — 새 창(시크릿)에서 열면 가입 플로우로 검증 가능"); }
function shareCode(){ toast("카카오톡 공유 (데모) — 실서비스는 딥링크로 코드 자동 입력"); }
render();
</script>
</body>
</html>
